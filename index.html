<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Spark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Quote Spark</h1>
        <p class="hint">Random quotes from a free public API</p>

        <blockquote id="quote" class="quote">Click the button to get a quote.</blockquote>
        <p id="author" class="author"></p>

        <button type="button" id="newQuoteBtn" class="btn">New quote</button>
        <p id="status" class="status" hidden></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
